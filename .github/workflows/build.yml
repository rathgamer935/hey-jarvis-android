name: Build Hey Jarvis APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/jarvis/wakeword

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://jitpack.io") }
              }
          }
          rootProject.name = "HeyJarvis"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.jarvis.wakeword"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.jarvis.wakeword"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation("com.github.msnilsen:openwakeword-android:0.1.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="Hey Jarvis"
                  android:allowBackup="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/jarvis/wakeword/MainActivity.kt <<'EOF'
          package com.jarvis.wakeword

          import android.app.Activity
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.content.pm.PackageManager
          import android.Manifest
          import android.widget.Toast
          import com.msnilsen.openwakeword.OpenWakeWord

          class MainActivity : Activity() {
              private var detector: OpenWakeWord? = null
              private lateinit var status: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(32, 32, 32, 32)
                  }

                  status = TextView(this).apply {
                      text = "Hey Jarvis is ready"
                      textSize = 22f
                      gravity = Gravity.CENTER
                  }

                  val start = Button(this).apply {
                      text = "Start Listening"
                      setOnClickListener { startListening() }
                  }

                  val stop = Button(this).apply {
                      text = "Stop Listening"
                      setOnClickListener { stopListening() }
                  }

                  layout.addView(status)
                  layout.addView(start)
                  layout.addView(stop)
                  setContentView(layout)
              }

              private fun startListening() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 10)
                      return
                  }

                  try {
                      detector = OpenWakeWord.Builder(this)
                          .setModel(OpenWakeWord.BuiltInModel.HEY_JARVIS)
                          .setThreshold(0.5f)
                          .build()

                      detector?.start { score ->
                          runOnUiThread {
                              if (score >= 0.5f) {
                                  status.text = "JARVIS DETECTED!"
                                  Toast.makeText(this, "Hey Jarvis detected!", Toast.LENGTH_SHORT).show()
                              }
                          }
                      }
                      status.text = "Listening for Hey Jarvis..."
                  } catch (e: Exception) {
                      status.text = "Error: ${e.message}"
                  }
              }

              private fun stopListening() {
                  detector?.stop()
                  detector?.release()
                  detector = null
                  status.text = "Stopped"
              }

              override fun onDestroy() {
                  stopListening()
                  super.onDestroy()
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == 10 && grantResults.isNotEmpty()
                      && grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      startListening()
                  }
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hey-Jarvis-APK
          path: app/build/outputs/apk/debug/app-debug.apk
